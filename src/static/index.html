<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Manager</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #24292e;
    }
    .card {
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 20px;
      background-color: #f6f8fa;
    }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 6px 10px;
      box-sizing: border-box;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(27,31,36,0.15);
      cursor: pointer;
      font-weight: 600;
    }
    .btn-create { background-color: #2da44e; color: white; }
    .btn-delete { background-color: #cf222e; color: white; }
    .status-frame {
      width: 100%;
      height: 40px;
      margin-top: 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: white;
      box-sizing: border-box;
    }
    ul { padding-left: 20px; }
    li { margin-bottom: 4px; }
  </style>
</head>
<body>

  <h1>Projects</h1>

  <!-- 1. Dynamic List rendered by listProjectsHandler -->
  <div class="card">
    <h2>All Projects</h2>
    <ul id="project-list"></ul>
  </div>

  <!-- Shared hidden iframe target for action responses -->
  <iframe name="action_frame" class="status-frame"></iframe>

  <!-- 2. Create Project Form -->
  <form action="/projects" method="POST" target="action_frame" class="card">
    <h2>Create Project</h2>
    <div class="form-group">
      <label for="createName">Project Name:</label>
      <input type="text" id="createName" name="project" placeholder="e.g., cool-project" required>
    </div>
    <button type="submit" class="btn-create">Create Project</button>
  </form>

  <!-- 3. Delete Project Form -->
  <!-- <form action="/projects/delete" method="POST" target="action_frame" class="card">
    <h2>Delete Project</h2>
    <div class="form-group">
      <label for="deleteName">Project Name:</label>
      <input type="text" id="deleteName" name="project" placeholder="e.g., demo" required>
    </div>
    <button type="submit" class="btn-delete">Delete Project</button>
  </form> -->

</body>
</html>

<script>
  fetch('/projects')
    .then(res => res.json())
    .then(projects => {
      const ul = document.getElementById('project-list');
      projects.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="/${p}">${p}</a>`;
        ul.appendChild(li);
      });
    });
</script>
